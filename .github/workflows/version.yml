# Opens and keeps up to date the pull request that turns changesets into versions.
#
# Merging that PR is what starts a release: it bumps the package versions, writes the
# changelogs, and rewrites apps/android/release.json, which is the file the Android
# release workflow watches.
name: Version

on:
  push:
    branches: [master]

concurrency: version-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: bun run release:version
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
