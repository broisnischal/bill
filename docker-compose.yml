services:
  db:
    image: postgres:17-alpine
    container_name: bill-postgres
    ports:
      - 5455:5432
    volumes:
      - bill_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bill"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for archived invoice PDFs.
  # Swap the endpoint for a real S3/Spaces bucket in production; the client is the same.
  storage:
    image: minio/minio:latest
    container_name: bill-minio
    command: server /data --console-address ":9003"
    ports:
      - 9002:9000
      - 9003:9003
    volumes:
      - bill_minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bill_postgres_data:
  bill_minio_data:
